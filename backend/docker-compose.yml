# Arcane backend infrastructure — deploy anytime with:
#   docker compose up -d
#   docker compose down
#
# See api-ref.md for DATABASE_URL, REDIS_URL, and app env vars.

name: arcane

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: arcane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcane}
      POSTGRES_DB: ${POSTGRES_DB:-arcane}
    ports:
      # Host port — change if 5434 conflicts with another local Postgres
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-arcane} -d ${POSTGRES_DB:-arcane}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arcane

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: arcane-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - arcane

volumes:
  postgres_data:
  redis_data:

networks:
  arcane:
    driver: bridge
