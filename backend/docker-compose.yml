# Arcane backend infrastructure — deploy anytime with:
#   docker compose up -d
#   docker compose down
#
# See api-ref.md for DATABASE_URL, REDIS_URL, and app env vars.

name: arcane

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: arcane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcane}
      POSTGRES_DB: ${POSTGRES_DB:-arcane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcane} -d ${POSTGRES_DB:-arcane}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - arcane

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: arcane-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - arcane

  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    container_name: arcane-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-arcane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-arcane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - arcane

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  arcane:
    driver: bridge
